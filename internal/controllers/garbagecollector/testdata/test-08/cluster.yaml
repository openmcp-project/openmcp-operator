apiVersion: clusters.openmcp.cloud/v1alpha1
kind: Cluster
metadata:
  name: cluster-ignore-annotation
  namespace: foo
  annotations:
    open-control-plane.io/garbage-collector: ignore
  finalizers:
  - "request.clusters.openmcp.cloud/dddddddd-dddd-dddd-dddd-dddddddddddd"
spec:
  profile: default
  kubernetes:
    version: "1.32"
  purposes:
  - test
  tenancy: Exclusive
---
