apiVersion: clusters.openmcp.cloud/v1alpha1
kind: AccessRequest
metadata:
  name: ar-ignore-annotation
  namespace: bar
  annotations:
    open-control-plane.io/garbage-collector: ignore
spec:
  clusterRef:
    name: gone-cluster
    namespace: foo
  permissions:
  - rules:
    - apiGroups:
      - "*"
      resources:
      - "*"
      verbs:
      - "*"
---
